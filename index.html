<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
      padding: 0;
    }

    body {
      justify-content: center;
      display: flex;
      align-items: center;
      background-color: hsl(0, 0%, 8%);
      text-align: center;
      padding: 25px;
    }

    img {
      border-radius: 100px;
      padding: 7px;
      width: 100px;
    }

    .first {
      border: 2px;
      margin-top: 10px;
      width: 30%;
      background-color: hsl(0, 0%, 12%);
      text-align: center;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      color: white;
      text-shadow: 2px 2px 2px red;
    }

    p {
      padding: 10px;
      color: white;
      margin-bottom: 10px;
    }

    .one {
      border: 2px;
      background-color: hsl(0, 0%, 20%);
      border-radius: 9px;
      font-weight: bold;
      color: white;
    }

    .two {
      border: 2px;
      border-radius: 9px;
      background-color: hsl(0, 0%, 20%);
      margin-top: 9px;
      font-weight: bold;
      color: white;
    }

    .three {
      border: 2px;
      border-radius: 9px;
      background-color: hsl(0, 0%, 20%);
      margin-top: 9px;
      font-weight: bold;
      color: white;
    }

    .four {
      border: 2px;
      border-radius: 9px;
      background-color: hsl(0, 0%, 20%);
      margin-top: 9px;
      font-weight: bold;
      color: white;
    }

    .five {
      border: 2px;
      border-radius: 9px;
      margin-top: 9px;
      background-color: hsl(0, 0%, 20%);
      font-weight: bold;
      color: white;
    }
    @media screen and (max-width:1000px){
      .first {
      border: 2px;
      margin-top: 10px;
      width: 100%;
      background-color: hsl(0, 0%, 12%);
      text-align: center;
      padding: 20px;
      border-radius: 10px;
    }
    }
  </style>
</head>

<body>
  <div class="first">
    <img src="assets/images/avatar-jessica.jpeg" alt="">
    <h1>Jessica Randall</h1>
    <p style="color: hsl(75, 94%, 57%);">London,United Kingdom</p>
    <p> Front-end developer and avid reader</p>
    <div class="one">
      <p>GitHub</p>
    </div>
    <div class="two">
      <p>frontend Mentor</p>
    </div>
    <div class="three">
      <p>Linkedln</p>
    </div>
    <div class="four">
      <p>Twitter</p>
    </div>
    <div class="five">
      <p>Instagram</p>
    </div>
  </div>
</body>

</html>
